# OpenPL API catalog — group: rigid-bodies
# Localized descriptions (es/en). Consumed by tools/gen_api_docs.py.
functions:
  plRigidBodyi:
    brief:
      es: Poner un valor a un parametro especifico
      en: "Set a value for a specific parameter"
    params:
      param:
        name_es: param
        name_en: param
        es: Especifica el parametro para introducir el valor. Puede ser PL_USER_POINTER, PL_COLLISION_CALLBACK_FILTER, PL_COLLISION_CALLBACK_FLAG, PL_USER_INDEX, PL_ACTIVATION_STATE, PL_ADD_COLLISION_FLAG, PL_COLLISION_SHAPE, PL_ANISOTROPIC_ROLLING_FRICTION.
        en: "Specifies the parameter to set the value for. Can be PL_USER_POINTER, PL_COLLISION_CALLBACK_FILTER, PL_COLLISION_CALLBACK_FLAG, PL_USER_INDEX, PL_ACTIVATION_STATE, PL_ADD_COLLISION_FLAG, PL_COLLISION_SHAPE, PL_ANISOTROPIC_ROLLING_FRICTION."
      value:
        name_es: value
        name_en: value
        es: El valor asignado.
        en: "The assigned value."
    notes:
      es:
      - 'Las siguientes constantes son aceptadas por param:'
      - PL_USER_POINTER poner un puntero de usuario. value debe ser el user pointer que desees.
      - PL_COLLISION_CALLBACK_FILTER poner el filtro para la prueba de contacto. value debe ser el filtrado.
      - PL_COLLISION_CALLBACK_FLAG asignar caracteristica para filtrar en la prueba de contacto. value debe ser la caracteristica
      - PL_USER_INDEX poner un indice de usuario. value debe ser el indice.
      - PL_ACTIVATION_STATE cambiar el estado de activacion. value debe ser PL_DIS_DACTIVATION si quieres que el cuerpo rigido permanesca activo todo el tiempo, PL_DIS_SIMULATION si quieres que el cuerpo rigido se ignore durante la simulacion, PL_ACTIVATE si quieres activar el cuerpo rigido.
      - PL_ADD_COLLISION_FLAG asignar carasteristicas de colision. value si quieres que el cuerpo rigido, PL_CF_KINEMATIC_OBJECT sea cinematico, PL_CF_STATIC_OBJECT estatico, PL_CF_CUSTOM_MATERIAL_CALLBACK materiales personalizados.
      - PL_COLLISION_SHAPE usar Dbvt broadphase. value debe ser 0.
      - PL_ANISOTROPIC_ROLLING_FRICTION poner el rozamiento anisotropico. value debe ser 0.
      en:
      - "The following constants are accepted by param:"
      - "PL_USER_POINTER sets a user pointer. value must be the user pointer you want."
      - "PL_COLLISION_CALLBACK_FILTER sets the filter for the contact test. value must be the filter."
      - "PL_COLLISION_CALLBACK_FLAG assigns a feature to filter in the contact test. value must be the feature"
      - "PL_USER_INDEX sets a user index. value must be the index."
      - "PL_ACTIVATION_STATE changes the activation state. value must be PL_DIS_DACTIVATION if you want the rigid body to remain active all the time, PL_DIS_SIMULATION if you want the rigid body to be ignored during the simulation, PL_ACTIVATE if you want to activate the rigid body."
      - "PL_ADD_COLLISION_FLAG assigns collision features. value if you want the rigid body, PL_CF_KINEMATIC_OBJECT kinematic, PL_CF_STATIC_OBJECT static, PL_CF_CUSTOM_MATERIAL_CALLBACK custom materials."
      - "PL_COLLISION_SHAPE uses Dbvt broadphase. value must be 0."
      - "PL_ANISOTROPIC_ROLLING_FRICTION sets the anisotropic friction. value must be 0."
    errors:
    - code: PL_INVALID_NAME
      es: si el cuerpo rigido no existe o el id es incorrecto.
      en: "if the rigid body does not exist or the id is incorrect."
    - code: PL_INVALID_OPERATION
      es: si intentas usar PL_COLLISION_CALLBACK_FILTER, PL_COLLISION_CALLBACK_FLAG sin antes activar la prueba de contactos o sin poner el user pointer.
      en: "if you try to use PL_COLLISION_CALLBACK_FILTER, PL_COLLISION_CALLBACK_FLAG without first enabling the contact test or without setting the user pointer."
  plRigidBodyf:
    brief:
      es: Poner un valor a un parametro especifico
      en: "Set a value for a specific parameter"
    params:
      param:
        name_es: param
        name_en: param
        es: Especifica el parametro para introducir el valor. Puede ser PL_MASS, PL_ANGULAR_FACTOR, PL_ROLLING_FRICTION, PL_SPINNING_FRICTION, PL_FRICTION, PL_RESTITUTION.
        en: "Specifies the parameter to set the value for. Can be PL_MASS, PL_ANGULAR_FACTOR, PL_ROLLING_FRICTION, PL_SPINNING_FRICTION, PL_FRICTION, PL_RESTITUTION."
      value:
        name_es: value
        name_en: value
        es: El valor asignado.
        en: "The assigned value."
    notes:
      es:
      - 'Las siguientes constantes son aceptadas por param:'
      - PL_MASS poner masa en kilogramos. value debe ser la masa en kilogramos.
      - PL_ANGULAR_FACTOR factor angular. value debe ser el factor angular.
      - PL_ROLLING_FRICTION friccion de rodadura. value debe ser el valor equivalente
      - PL_SPINNING_FRICTION friccion giratoria. value debe ser el valor equivalente.
      - PL_FRICTION friccion. value debe ser el valor equivalente.
      - PL_RESTITUTION coeficiente de restitucion. value debe ser el valor equivalente.
      en:
      - "The following constants are accepted by param:"
      - "PL_MASS sets mass in kilograms. value must be the mass in kilograms."
      - "PL_ANGULAR_FACTOR angular factor. value must be the angular factor."
      - "PL_ROLLING_FRICTION rolling friction. value must be the equivalent value"
      - "PL_SPINNING_FRICTION spinning friction. value must be the equivalent value."
      - "PL_FRICTION friction. value must be the equivalent value."
      - "PL_RESTITUTION restitution coefficient. value must be the equivalent value."
    errors:
    - code: PL_INVALID_NAME
      es: si el cuerpo rigido no existe o el id es incorrecto.
      en: "if the rigid body does not exist or the id is incorrect."
    - code: PL_INVALID_OPERATION
      es: en raras ocaciones.
      en: "in rare occasions."
    - code: PL_INVALID_ENUM
      es: si param es una constante invalida o no permitida.
      en: "if param is an invalid or disallowed constant."
  plRigidBody3f:
    brief:
      es: Poner un valor a un parametro especifico
      en: "Set a value for a specific parameter"
    params:
      param:
        name_es: param
        name_en: param
        es: Especifica el parametro para introducir el valor. Puede ser PL_POSITION, PL_MOTION_STATE_POSITION, PL_DAMPING, PL_LINEAR_FACTOR, PL_ANGULAR_FACTOR, PL_LOCAL_INERTIA, PL_APPLY_CENTRAL_FORCE PL_APPLY_TORQUE, PL_APPLY_CENTRAL_IMPULSE, PL_APPLY_TORQUE_IMPULSE, PL_ANISOTROPIC_FRICTION, PL_COL_INTERP_LINEAR_VEL, PL_COL_INTERP_ANGULAR_VEL.
        en: "Specifies the parameter to set the value for. Can be PL_POSITION, PL_MOTION_STATE_POSITION, PL_DAMPING, PL_LINEAR_FACTOR, PL_ANGULAR_FACTOR, PL_LOCAL_INERTIA, PL_APPLY_CENTRAL_FORCE PL_APPLY_TORQUE, PL_APPLY_CENTRAL_IMPULSE, PL_APPLY_TORQUE_IMPULSE, PL_ANISOTROPIC_FRICTION, PL_COL_INTERP_LINEAR_VEL, PL_COL_INTERP_ANGULAR_VEL."
      x_y_z:
        name_es: x y z
        name_en: x y z
        es: Los valores asignados.
        en: "The assigned values."
    notes:
      es:
      - 'Las siguientes constantes son aceptadas por param:'
      - PL_POSITION poner la posicion del centro de masa. x y z debe ser el vector(x,y,z) de posicion.
      - PL_MOTION_STATE_POSITION poner la posicion del estado de movimiento. x y z debe ser el vector(x,y,z) de posicion.
      - PL_DAMPING poner factor de amortiguacion lineal y giratoria. x debe ser el factor amortiguacion lineal. y debe ser el factor amortiguacion giratoria.
      - PL_LINEAR_FACTOR poner el factor lineal. x y z es el vector(x,y,z).
      - PL_ANGULAR_FACTOR poner el factor de giracion. x y z es el vector(x,y,z).
      - PL_LOCAL_INERTIA poner el eje de inercia local. x y z debe ser el vector(x,y,z) de inercia.
      - PL_APPLY_CENTRAL_FORCE aplicar una fuerza central. x y z es el vector de fuerza a aplicar(x,y,z).
      - PL_APPLY_TORQUE aplicar torque. x y z es el vector de torque(x,y,z).
      - PL_APPLY_CENTRAL_IMPULSE aplicar impulso central. x y z debe ser el vector(x,y,z) de impulso.
      - PL_APPLY_TORQUE_IMPULSE aplicar impulso con torque. x y z es el vector(x,y,z) de impulso.
      - PL_ANISOTROPIC_FRICTION poner el factor de friccion anisotropica. x y z es el vector(x,y,z).
      - PL_COL_INTERP_LINEAR_VEL poner la velocidad lineal de interpolacion.x y z es el vector(x,y,z).
      - PL_COL_INTERP_ANGULAR_VEL poner la velocidad giratoria de interpolacion. x y z es el vector(x,y,z).
      en:
      - "The following constants are accepted by param:"
      - "PL_POSITION sets the center-of-mass position. x y z must be the position vector (x,y,z)."
      - "PL_MOTION_STATE_POSITION sets the motion-state position. x y z must be the position vector (x,y,z)."
      - "PL_DAMPING sets the linear and angular damping factor. x must be the linear damping factor. y must be the angular damping factor."
      - "PL_LINEAR_FACTOR sets the linear factor. x y z is the vector (x,y,z)."
      - "PL_ANGULAR_FACTOR sets the spinning factor. x y z is the vector (x,y,z)."
      - "PL_LOCAL_INERTIA sets the local inertia axis. x y z must be the inertia vector (x,y,z)."
      - "PL_APPLY_CENTRAL_FORCE applies a central force. x y z is the force vector to apply (x,y,z)."
      - "PL_APPLY_TORQUE applies torque. x y z is the torque vector (x,y,z)."
      - "PL_APPLY_CENTRAL_IMPULSE applies a central impulse. x y z must be the impulse vector (x,y,z)."
      - "PL_APPLY_TORQUE_IMPULSE applies impulse with torque. x y z is the impulse vector (x,y,z)."
      - "PL_ANISOTROPIC_FRICTION sets the anisotropic friction factor. x y z is the vector (x,y,z)."
      - "PL_COL_INTERP_LINEAR_VEL sets the interpolated linear velocity. x y z is the vector (x,y,z)."
      - "PL_COL_INTERP_ANGULAR_VEL sets the interpolated spinning velocity. x y z is the vector (x,y,z)."
    errors:
    - code: PL_INVALID_NAME
      es: si el cuerpo rigido no existe o el id es incorrecto.
      en: "if the rigid body does not exist or the id is incorrect."
    - code: PL_INVALID_OPERATION
      es: en raras ocaciones.
      en: "in rare occasions."
    - code: PL_INVALID_ENUM
      es: si param es una constante invalida o no permitida.
      en: "if param is an invalid or disallowed constant."
  plRigidBodyfv:
    brief:
      es: Poner un valor a un parametro especifico
