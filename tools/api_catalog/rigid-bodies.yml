        en: "Specifies the parameter to set the value for. Can be PL_POSITION, PL_MOTION_STATE_POSITION, PL_BASIS, PL_LINEAR_FACTOR, PL_ANGULAR_FACTOR, PL_LOCAL_INERTIA, PL_APPLY_CENTRAL_FORCE PL_APPLY_TORQUE, PL_APPLY_CENTRAL_IMPULSE, PL_APPLY_TORQUE_IMPULSE, PL_ORIENTATION, PL_TRANSFORM, PL_MOTION_STATE_TRANSFORM, PL_COL_WORLD_TRANSFORM, PL_COL_INTERP_WORLD_TRANSFORM."
      values:
        name_es: values
        name_en: values
        es: Los valores asignados.
        en: "The assigned values."
      lenght:
        name_es: lenght
        name_en: lenght
        es: La longitud del arreglo de valores.
        en: "The length of the values array."
    notes:
      es:
      - 'Las siguientes constantes son aceptadas por param:'
      - PL_POSITION poner la posicion del centro de masa. values debe ser el vector de posicion. lenght debe ser 3
      - PL_MOTION_STATE_POSITION poner la posicion del estado de movimiento. values debe ser el vector(x,y,z) de posicion. lenght debe ser 3
      - PL_BASIS poner un nuevo basis. values debe ser una matrix3x3. lenght debe ser 3
      - PL_LINEAR_FACTOR poner el factor lineal. values es el vector.lenght debe ser 3
      - PL_ANGULAR_FACTOR poner el factor giracion. values es el vector.lenght debe ser 3
      - PL_LOCAL_INERTIA poner el eje de inercia local. values debe ser el vector de inercia.lenght debe ser 3
      - PL_APPLY_CENTRAL_FORCE aplicar una fuerza central. values es el vector de fuerza a aplicar. lenght debe ser 3
      - PL_APPLY_TORQUE aplicar torque. values es el vector de torque. lenght debe ser 3
      - PL_APPLY_CENTRAL_IMPULSE aplicar impulso central. values debe ser el vector de impulso.lenght debe ser 3
      - PL_APPLY_TORQUE_IMPULSE aplicar impulso con torque. values es el vector de impulso.lenght debe ser 3
      - PL_ORIENTATION poner la orientacion o rotacion. values es el quaternion de rotacion.lenght debe ser 4
      - PL_TRANSFORM poner la transformacion.values debe ser un matrix4x4 de transformacion.lenght debe ser 16
      - PL_MOTION_STATE_TRANSFORM poner la transformacion en el estado de movimiento. values debe ser un matrix4x4 de transformacion.lenght debe ser 16
      - PL_COL_WORLD_TRANSFORM poner la transformacion del mundo.values debe ser un matrix4x4 de transformacion.lenght debe ser 16
      - PL_COL_INTERP_WORLD_TRANSFORM poner la transformacion del mundo interpolada. values debe ser un matrix4x4 de transformacion.lenght debe ser 16
      en:
      - "The following constants are accepted by param:"
      - "PL_POSITION sets the center-of-mass position. values must be the position vector. lenght must be 3"
      - "PL_MOTION_STATE_POSITION sets the motion-state position. values must be the position vector (x,y,z). lenght must be 3"
      - "PL_BASIS sets a new basis. values must be a matrix3x3. lenght must be 3"
      - "PL_LINEAR_FACTOR sets the linear factor. values is the vector. lenght must be 3"
      - "PL_ANGULAR_FACTOR sets the spinning factor. values is the vector. lenght must be 3"
      - "PL_LOCAL_INERTIA sets the local inertia axis. values must be the inertia vector. lenght must be 3"
      - "PL_APPLY_CENTRAL_FORCE applies a central force. values is the force vector to apply. lenght must be 3"
      - "PL_APPLY_TORQUE applies torque. values is the torque vector. lenght must be 3"
      - "PL_APPLY_CENTRAL_IMPULSE applies a central impulse. values must be the impulse vector. lenght must be 3"
      - "PL_APPLY_TORQUE_IMPULSE applies impulse with torque. values is the impulse vector. lenght must be 3"
      - "PL_ORIENTATION sets the orientation or rotation. values is the rotation quaternion. lenght must be 4"
      - "PL_TRANSFORM sets the transformation. values must be a transformation matrix4x4. lenght must be 16"
      - "PL_MOTION_STATE_TRANSFORM sets the transformation in the motion state. values must be a transformation matrix4x4. lenght must be 16"
      - "PL_COL_WORLD_TRANSFORM sets the world transformation. values must be a transformation matrix4x4. lenght must be 16"
      - "PL_COL_INTERP_WORLD_TRANSFORM sets the interpolated world transformation. values must be a transformation matrix4x4. lenght must be 16"
    errors:
    - code: PL_INVALID_NAME
      es: si el cuerpo rigido no existe o el id es incorrecto.
      en: "if the rigid body does not exist or the id is incorrect."
    - code: PL_INVALID_OPERATION
      es: en raras ocaciones.
      en: "in rare occasions."
    - code: PL_INVALID_ENUM
      es: si param es una constante invalida o no permitida.
      en: "if param is an invalid or disallowed constant."
